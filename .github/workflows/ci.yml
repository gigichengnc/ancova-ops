name: CI

on:
  push:
    branches: [main, phase-0-foundation]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Routing evaluation smoke test
        run: ancova-evaluate --json > /tmp/ancova-routing-evaluation.json

      - name: Adaptive routing policy smoke test
        run: ancova-policy evaluate --synthetic-n 1200 --seed 23 > /tmp/ancova-policy.json

      - name: Outcome analysis smoke test
        run: ancova-analyze --synthetic-n 120 --seed 41 --json > /tmp/ancova-analysis.json

      - name: Management report smoke test
        run: >-
          ancova-management-report --synthetic-n 120 --seed 41
          --output /tmp/ancova-management-report.md
          --json-output /tmp/ancova-management-report.json

      - name: Data governance policy check
        run: ancova-governance-check --json > /tmp/ancova-data-governance.json
