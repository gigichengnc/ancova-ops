name: One-shot v1.2 changelog update

on:
  push:
    branches: [v1.2.0-concrete-cleanup]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.2.0-concrete-cleanup
          fetch-depth: 0
      - name: Add v1.2 changelog section
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          if '## [1.2.0]' not in text:
              marker = 'All notable project checkpoints are documented here.\n\n'
              section = '''## [1.2.0] - 2026-08-21\n\n### Changed\n\n- Completed the project rename at the implementation level: `src/reasoned_ops` is now the single application package.\n- Removed the temporary `src/ancova_ops` compatibility namespace introduced during the v1.1 migration.\n- Replaced remaining internal imports and current-facing command/path references with the canonical ReasonedOps namespace.\n- Replaced temporary showcase/management/applicability wrappers with self-contained ReasonedOps implementations.\n- Rewrote the README around one concrete request → routing → human review → outcome → evaluation workflow rather than architecture-first explanation.\n- Reworked the generated showcase so it demonstrates one service case and the later management evidence check directly.\n- Updated project-status, release-readiness, hackathon-origin, storefront and showcase documentation for the clean v1.2 identity.\n- Added regression coverage preventing the legacy source namespace from reappearing.\n\n### Evidence and deployment status\n\nThis release changes naming consistency, code organisation and reviewer usability. It does not add real-world validation. Quantitative development evidence remains synthetic or hand-authored, and real private-data pilot use and production deployment remain not approved.\n\n'''
              text = text.replace(marker, marker + section, 1)
              path.write_text(text, encoding='utf-8')

          Path('.github/workflows/one-shot-v1.2-changelog.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: record v1.2 cleanup checkpoint"
          git push origin HEAD:v1.2.0-concrete-cleanup
