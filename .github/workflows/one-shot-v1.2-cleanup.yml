name: One-shot v1.2 codebase cleanup

on:
  push:
    branches: [v1.2.0-concrete-cleanup]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: v1.2.0-concrete-cleanup
          fetch-depth: 0

      - name: Complete ReasonedOps migration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import shutil

          root = Path('.')
          legacy = root / 'src' / 'ancova_ops'
          canonical = root / 'src' / 'reasoned_ops'

          # Replace the temporary compatibility wrappers with the complete implementations.
          for filename in ('applicability.py', 'management_report.py', 'showcase.py'):
              shutil.copy2(legacy / filename, canonical / filename)

          # Current-facing source, tests and documentation should use the canonical identity.
          roots = [canonical, root / 'tests', root / 'docs']
          standalone = [root / 'AGENTS.md', root / 'config' / 'data-governance.json']
          skip = {
              root / 'docs' / 'hackathon-origin.md',
          }
          replacements = (
              ('ancova_ops', 'reasoned_ops'),
              ('.ancova_ops', '.reasoned_ops'),
              ('ancova-', 'reasoned-'),
              ('ANCOVA Ops', 'ReasonedOps'),
          )

          candidates = []
          for directory in roots:
              candidates.extend(path for path in directory.rglob('*') if path.is_file())
          candidates.extend(standalone)

          for path in candidates:
              if path in skip or path.name == 'CHANGELOG.md':
                  continue
              if path.suffix not in {'.py', '.md', '.json', '.yml', '.yaml', '.toml', '.cff'} and path.name != 'AGENTS.md':
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          # Remove the legacy source tree completely.
          shutil.rmtree(legacy)

          # v1.2.0 is the clean-break checkpoint.
          pyproject = root / 'pyproject.toml'
          text = pyproject.read_text(encoding='utf-8')
          text = re.sub(r'(?m)^version = "[^"]+"$', 'version = "1.2.0"', text, count=1)
          text = '\n'.join(
              line for line in text.splitlines()
              if 'src/ancova_ops/' not in line
          ) + '\n'
          pyproject.write_text(text, encoding='utf-8')

          init_file = canonical / '__init__.py'
          text = init_file.read_text(encoding='utf-8')
          text = re.sub(r'__version__ = "[^"]+"', '__version__ = "1.2.0"', text)
          init_file.write_text(text, encoding='utf-8')

          citation = root / 'CITATION.cff'
          text = citation.read_text(encoding='utf-8')
          text = re.sub(r'(?m)^version: "[^"]+"$', 'version: "1.2.0"', text)
          citation.write_text(text, encoding='utf-8')

          # Remove compatibility expectations from the release-regression test.
          version_test = root / 'tests' / 'test_version.py'
          text = version_test.read_text(encoding='utf-8')
          text = text.replace('import reasoned_ops\nimport reasoned_ops\n', 'import reasoned_ops\n')
          text = re.sub(r'EXPECTED_VERSION = "[^"]+"', 'EXPECTED_VERSION = "1.2.0"', text)
          text = text.replace('    assert reasoned_ops.__version__ == EXPECTED_VERSION\n    assert reasoned_ops.__version__ == EXPECTED_VERSION\n', '    assert reasoned_ops.__version__ == EXPECTED_VERSION\n')
          text = re.sub(r'def test_v\d+_cli_surface_is_registered', 'def test_v120_cli_surface_is_registered', text)
          marker = 'def test_apache_license_metadata_and_file_are_present() -> None:\n'
          legacy_test = (
              'def test_legacy_ancova_namespace_is_removed() -> None:\n'
              '    assert not (PROJECT_ROOT / "src" / "ancova_ops").exists()\n\n\n'
          )
          if legacy_test not in text:
              text = text.replace(marker, legacy_test + marker)
          version_test.write_text(text, encoding='utf-8')

          # Update the API/checkpoint test if its function name embeds the old patch version.
          api_metadata = root / 'tests' / 'test_api_metadata.py'
          if api_metadata.exists():
              text = api_metadata.read_text(encoding='utf-8')
              text = text.replace('1.1.1', '1.2.0')
              api_metadata.write_text(text, encoding='utf-8')

          # The migration workflow must not remain in the finished repository.
          (root / '.github' / 'workflows' / 'one-shot-v1.2-cleanup.yml').unlink()
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: complete ReasonedOps codebase migration"
          git push origin HEAD:v1.2.0-concrete-cleanup
