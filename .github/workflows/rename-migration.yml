name: One-shot ReasonedOps rename migration

on:
  push:
    branches: [rename-to-reasoned-ops]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message == 'chore: trigger automated ReasonedOps rename'
    runs-on: ubuntu-latest

    steps:
      - name: Check out rename branch
        uses: actions/checkout@v4
        with:
          ref: rename-to-reasoned-ops
          fetch-depth: 0

      - name: Rename codebase and public surface
        shell: bash
        run: |
          set -euo pipefail

          # Replace the temporary copied package with a real git rename so history follows the code.
          rm -rf src/reasoned_ops
          git mv src/ancova_ops src/reasoned_ops

          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          skip = {
              Path('CHANGELOG.md'),
              Path('.github/workflows/rename-migration.yml'),
          }
          allowed_suffixes = {'.py', '.md', '.toml', '.yml', '.yaml', '.cff', '.json'}
          allowed_names = {'.gitignore', 'AGENTS.md'}

          replacements = [
              ('https://github.com/gigichengnc/ancova-ops', 'https://github.com/gigichengnc/reasoned-ops'),
              ('gigichengnc/ancova-ops', 'gigichengnc/reasoned-ops'),
              ('ANCOVA Ops', 'ReasonedOps'),
              ('ancova_ops', 'reasoned_ops'),
              ('ancova-ops', 'reasoned-ops'),
              ('.ancova_ops', '.reasoned_ops'),
              ('ancova-', 'reasoned-'),
          ]

          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path in skip:
                  continue
              if path.suffix not in allowed_suffixes and path.name not in allowed_names:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          # Versioned rename checkpoint.
          pyproject = Path('pyproject.toml')
          text = pyproject.read_text(encoding='utf-8')
          text = re.sub(r'(?m)^version = "[^"]+"$', 'version = "1.1.0"', text, count=1)
          pyproject.write_text(text, encoding='utf-8')

          init = Path('src/reasoned_ops/__init__.py')
          text = init.read_text(encoding='utf-8')
          text = re.sub(r'__version__ = "[^"]+"', '__version__ = "1.1.0"', text)
          init.write_text(text, encoding='utf-8')

          citation = Path('CITATION.cff')
          text = citation.read_text(encoding='utf-8')
          text = re.sub(r'(?m)^version: "[^"]+"$', 'version: "1.1.0"', text)
          citation.write_text(text, encoding='utf-8')

          version_test = Path('tests/test_version.py')
          text = version_test.read_text(encoding='utf-8')
          text = re.sub(r'EXPECTED_VERSION = "[^"]+"', 'EXPECTED_VERSION = "1.1.0"', text)
          version_test.write_text(text, encoding='utf-8')
          PY

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: rename codebase to ReasonedOps"
          git push origin HEAD:rename-to-reasoned-ops
