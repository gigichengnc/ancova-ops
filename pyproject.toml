[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ancova-ops"
version = "0.5.3"
description = "Human-centred service intelligence with interpretable routing and outcome analytics"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "numpy>=2.0",
  "pandas>=2.2",
  "pydantic>=2.9",
  "scikit-learn>=1.5",
  "statsmodels>=0.14",
  "uvicorn>=0.30",
]

[project.scripts]
ancova-analyze = "ancova_ops.analysis_report:main"
ancova-evaluate = "ancova_ops.evaluation:main"
ancova-governance-check = "ancova_ops.governance:main"
ancova-management-report = "ancova_ops.management_report:main"
ancova-policy = "ancova_ops.adaptive:main"
ancova-longitudinal = "ancova_ops.longitudinal:main"
ancova-showcase = "ancova_ops.showcase:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"src/ancova_ops/longitudinal.py" = ["F401", "ISC004", "RUF046"]