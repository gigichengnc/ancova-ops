[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ancova-ops"
version = "1.0.0"
description = "Evidence-aware service operations with explainable routing, auditable human review and guarded outcome evaluation"
readme = "README.md"
license = "Apache-2.0"
authors = [
  {name = "Gigi Cheng"},
]
requires-python = ">=3.11"
keywords = [
  "service-operations",
  "human-in-the-loop",
  "ancova",
  "regression",
  "offline-evaluation",
  "longitudinal-analysis",
  "data-governance",
  "responsible-ai",
]
dependencies = [
  "fastapi>=0.115",
  "numpy>=2.0",
  "pandas>=2.2",
  "pydantic>=2.9",
  "scikit-learn>=1.5",
  "statsmodels>=0.14",
  "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/gigichengnc/ancova-ops"
Repository = "https://github.com/gigichengnc/ancova-ops"
Issues = "https://github.com/gigichengnc/ancova-ops/issues"
Changelog = "https://github.com/gigichengnc/ancova-ops/blob/main/CHANGELOG.md"
Citation = "https://github.com/gigichengnc/ancova-ops/blob/main/CITATION.cff"

[project.scripts]
ancova-analyze = "ancova_ops.analysis_report:main"
ancova-applicability = "ancova_ops.applicability:main"
ancova-evaluate = "ancova_ops.evaluation:main"
ancova-governance-check = "ancova_ops.governance:main"
ancova-management-report = "ancova_ops.management_report:main"
ancova-policy = "ancova_ops.adaptive:main"
ancova-longitudinal = "ancova_ops.longitudinal:main"
ancova-showcase = "ancova_ops.showcase:main"
ancova-validity = "ancova_ops.validity:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"src/ancova_ops/longitudinal.py" = ["F401", "ISC004", "RUF046"]