[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reasoned-ops"
version = "1.4.2"
description = "Evidence-aware service operations with explainable routing, auditable human review and guarded outcome evaluation"
readme = {file = "PYPI.md", content-type = "text/markdown"}
license = "Apache-2.0"
authors = [
  {name = "Gigi Cheng"},
]
requires-python = ">=3.11"
keywords = [
  "service-operations",
  "human-in-the-loop",
  "evidence-aware",
  "ancova",
  "regression",
  "offline-evaluation",
  "longitudinal-analysis",
  "data-governance",
  "responsible-ai",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "fastapi>=0.115",
  "numpy>=2.0",
  "pandas>=2.2",
  "pydantic>=2.9",
  "scikit-learn>=1.5",
  "statsmodels>=0.14",
  "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/gigichengnc/reasoned-ops"
Repository = "https://github.com/gigichengnc/reasoned-ops"
Issues = "https://github.com/gigichengnc/reasoned-ops/issues"
Changelog = "https://github.com/gigichengnc/reasoned-ops/blob/main/CHANGELOG.md"
Citation = "https://github.com/gigichengnc/reasoned-ops/blob/main/CITATION.cff"

[project.scripts]
reasoned-analyze = "reasoned_ops.analysis_report:main"
reasoned-applicability = "reasoned_ops.applicability:main"
reasoned-evaluate = "reasoned_ops.evaluation:main"
reasoned-governance-check = "reasoned_ops.governance:main"
reasoned-management-report = "reasoned_ops.management_report:main"
reasoned-policy = "reasoned_ops.adaptive:main"
reasoned-longitudinal = "reasoned_ops.longitudinal:main"
reasoned-showcase = "reasoned_ops.showcase:main"
reasoned-validity = "reasoned_ops.validity:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"src/reasoned_ops/longitudinal.py" = ["F401", "ISC004", "RUF046"]
